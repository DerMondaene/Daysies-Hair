<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daysies Hair – Cameroonian Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #120904;
            color: #fff;
            touch-action: none;
        }

        #app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
            background: radial-gradient(circle at center, #2c160a 0%, #120904 100%);
            position: relative;
        }

        canvas {
            touch-action: none;
            display: block;
        }

        /* Smooth pulse animation for active tool */
        @keyframes toolPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .active-tool {
            animation: toolPulse 1.8s infinite ease-in-out;
            border-color: #fbbf24 !important;
            background-color: #78350f !important;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        /* Glassmorphism overlays */
        .glass-panel {
            background: rgba(30, 15, 8, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Custom scrollbar for sidebar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header HUD -->
    <header class="h-14 bg-amber-950/80 border-b border-amber-700/50 px-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">💈</span>
            <h1 class="font-bold text-amber-400 text-base sm:text-lg tracking-wide">Daysies Hair</h1>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="bg-amber-900/90 border border-amber-500/50 px-3 py-1 rounded-full text-xs font-bold text-amber-200 tracking-wider" id="hud-score">
                0 FCFA
            </div>
            <button onclick="togglePause()" class="w-8 h-8 rounded-full bg-amber-800 border border-amber-400/60 flex items-center justify-center text-amber-200 active:scale-95 transition-transform" aria-label="Pause">
                ⏸️
            </button>
        </div>
    </header>

    <!-- Main Game Workspace -->
    <main class="flex-1 flex relative overflow-hidden">
        <!-- Customer Queue Sidebar -->
        <aside class="w-20 sm:w-24 bg-black/40 border-r border-amber-800/40 p-2 flex flex-col items-center gap-3 shrink-0 z-10">
            <span class="text-[10px] font-bold text-amber-400/80 uppercase tracking-widest text-center" id="txt-queue">Queue</span>
            <div id="queue-list" class="w-full flex flex-col gap-2.5 overflow-y-auto no-scrollbar"></div>
        </aside>

        <!-- Braiding Station -->
        <section class="flex-1 flex flex-col items-center justify-between p-2 relative">
            <!-- Required Tool Banner -->
            <div class="w-full max-w-sm bg-amber-900/60 border border-amber-500/40 rounded-xl px-3 py-1.5 flex items-center justify-between text-xs text-amber-100 font-medium shadow-md">
                <span class="text-amber-300/80" id="txt-req-label">Required:</span>
                <div class="flex items-center gap-1.5 font-bold text-amber-200" id="required-tool-display">
                    <span>🪡</span> <span>Braiding Needle</span>
                </div>
            </div>

            <!-- Canvas Container -->
            <div id="canvas-wrapper" class="w-full flex-1 flex items-center justify-center relative my-1">
                <canvas id="hairCanvas" class="rounded-2xl border-2 border-amber-800/60 shadow-2xl max-w-full max-h-full object-contain"></canvas>
            </div>
        </section>
    </main>

    <!-- Bottom Tool Tray -->
    <footer class="h-20 bg-amber-950/90 border-t border-amber-800/60 p-2 px-3 grid grid-cols-4 gap-2 z-10 shrink-0">
        <button id="btn-comb" onclick="selectTool('comb')" class="tool-btn bg-amber-900/40 border border-amber-700/50 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all">
            <span class="text-xl">📏</span>
            <span class="text-[11px] font-bold text-amber-200" id="lbl-comb">Comb</span>
        </button>
        <button id="btn-needle" onclick="selectTool('needle')" class="tool-btn active-tool bg-amber-900/40 border border-amber-700/50 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all">
            <span class="text-xl">🪡</span>
            <span class="text-[11px] font-bold text-amber-200" id="lbl-needle">Needle</span>
        </button>
        <button id="btn-oil" onclick="selectTool('oil')" class="tool-btn bg-amber-900/40 border border-amber-700/50 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all">
            <span class="text-xl">✨</span>
            <span class="text-[11px] font-bold text-amber-200" id="lbl-oil">Edge Oil</span>
        </button>
        <button id="btn-beads" onclick="selectTool('beads')" class="tool-btn bg-amber-900/40 border border-amber-700/50 rounded-xl flex flex-col items-center justify-center gap-1 active:scale-95 transition-all">
            <span class="text-xl">🐚</span>
            <span class="text-[11px] font-bold text-amber-200" id="lbl-beads">Beads</span>
        </button>
    </footer>

    <!-- Main Menu Overlay -->
    <div id="mainMenu" class="absolute inset-0 z-30 glass-panel flex flex-col justify-center items-center p-6 text-center">
        <div class="text-5xl mb-2">💈</div>
        <h1 class="text-3xl font-extrabold text-amber-400 tracking-tight mb-1">Daysies Hair</h1>
        <p class="text-xs text-amber-200/80 mb-6 max-w-xs">Cameroonian Salon • Infinite Procedural African Braiding</p>

        <div class="w-full max-w-xs space-y-4 mb-6 text-left">
            <div>
                <label id="lbl-lang" class="block text-xs font-semibold text-amber-300 mb-1">Language / Sprache / Langue</label>
                <select id="select-lang" onchange="changeLanguage(this.value)" class="w-full bg-amber-950 border border-amber-500/50 rounded-lg p-2.5 text-sm text-amber-100 font-medium focus:outline-none focus:border-amber-400">
                    <option value="de">Deutsch</option>
                    <option value="en" selected>English</option>
                    <option value="fr">Français</option>
                </select>
            </div>

            <div>
                <label id="lbl-diff" class="block text-xs font-semibold text-amber-300 mb-1">Difficulty / Schwierigkeit</label>
                <select id="select-diff" class="w-full bg-amber-950 border border-amber-500/50 rounded-lg p-2.5 text-sm text-amber-100 font-medium focus:outline-none focus:border-amber-400">
                    <option value="easy">Easy / Facile / Leicht</option>
                    <option value="medium" selected>Medium / Moyen / Normal</option>
                    <option value="hard">Master / Expert / Meister</option>
                </select>
            </div>
        </div>

        <button id="btn-start" onclick="startGame()" class="w-full max-w-xs bg-gradient-to-r from-amber-500 to-amber-600 text-amber-950 font-bold py-3.5 px-6 rounded-xl shadow-lg active:scale-98 transition-transform text-base">
            Start Game ➔
        </button>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="absolute inset-0 z-30 glass-panel hidden flex-col justify-center items-center p-6 text-center">
        <h2 id="txt-paused" class="text-2xl font-bold text-amber-400 mb-6">Game Paused</h2>
        <div class="w-full max-w-xs space-y-3">
            <button id="btn-resume" onclick="togglePause()" class="w-full bg-amber-500 text-amber-950 font-bold py-3 px-4 rounded-xl shadow active:scale-98">
                Resume ➔
            </button>
            <button id="btn-restart" onclick="restartGame()" class="w-full bg-amber-900 border border-amber-600 text-amber-100 font-semibold py-3 px-4 rounded-xl active:scale-98">
                Restart 🔄
            </button>
            <button id="btn-exit" onclick="exitToMenu()" class="w-full bg-amber-950 border border-amber-800 text-amber-300/80 font-semibold py-3 px-4 rounded-xl active:scale-98">
                Main Menu 🏠
            </button>
        </div>
    </div>

    <!-- Celebration / Performance Rating Overlay -->
    <div id="celebrationOverlay" class="absolute inset-0 z-30 glass-panel hidden flex-col justify-center items-center p-6 text-center">
        <div class="text-4xl mb-2">✨</div>
        <h2 id="txt-celeb-title" class="text-2xl font-black text-amber-400 mb-1">HAIRSTYLE COMPLETE!</h2>
        <div id="celeb-stars" class="text-4xl my-3 tracking-widest filter drop-shadow">⭐⭐⭐</div>
        <p id="celeb-text" class="text-xs text-amber-200/90 mb-4 font-medium">Time: 12s • Precision: High</p>
        
        <div class="bg-amber-900/60 border border-amber-500/40 rounded-xl p-3 px-6 mb-6">
            <span id="lbl-earnings" class="text-xs text-amber-300 block mb-0.5">Earnings:</span>
            <span id="celeb-money" class="text-xl font-extrabold text-green-400">+1,500 FCFA</span>
        </div>

        <button id="btn-next-cust" onclick="nextCustomer()" class="w-full max-w-xs bg-gradient-to-r from-amber-500 to-amber-600 text-amber-950 font-bold py-3.5 px-6 rounded-xl shadow-lg active:scale-98 transition-transform text-base">
            Next Customer ➔
        </button>
    </div>
</div>

<script>
    // Audio Context Setup
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function triggerHaptic(type = 'light') {
        if (!navigator.vibrate) return;
        if (type === 'light') navigator.vibrate(12);
        else if (type === 'medium') navigator.vibrate(30);
        else if (type === 'heavy') navigator.vibrate([40, 60, 40]);
    }

    function playStrokeSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e){}
    }

    function playFanfareSound() {
        if (!audioCtx) return;
        try {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.09);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.09 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.09);
                osc.stop(audioCtx.currentTime + idx * 0.09 + 0.3);
            });
        } catch(e){}
    }

    // Localization Data
    const i18n = {
        de: {
            queue: "Warteschlange", req: "Benötigt:", comb: "Kamm", needle: "Nadel", oil: "Edge Öl", beads: "Perlen",
            lang: "Sprache", diff: "Schwierigkeit", start: "Spiel Starten ➔", paused: "Spiel Pausiert",
            resume: "Weiterspielen ➔", restart: "Neustart 🔄", exit: "Hauptmenü 🏠", nextCust: "Nächste Kundin ➔",
            celebTitle: "FRISUR FERTIG!", earnings: "Verdienst:",
            tools: { comb: "Abteilkamm", needle: "Flechtnadel", oil: "Glanzöl & Gel", beads: "Perlen & Muscheln" }
        },
        en: {
            queue: "Queue", req: "Required:", comb: "Comb", needle: "Needle", oil: "Edge Oil", beads: "Beads",
            lang: "Language", diff: "Difficulty", start: "Start Game ➔", paused: "Game Paused",
            resume: "Resume ➔", restart: "Restart 🔄", exit: "Main Menu 🏠", nextCust: "Next Customer ➔",
            celebTitle: "HAIRSTYLE COMPLETE!", earnings: "Earnings:",
            tools: { comb: "Parting Comb", needle: "Braiding Needle", oil: "Edge Oil & Gel", beads: "Beads & Shells" }
        },
        fr: {
            queue: "Attente", req: "Requis:", comb: "Peigne", needle: "Aiguille", oil: "Huile", beads: "Perles",
            lang: "Langue", diff: "Difficulté", start: "Commencer ➔", paused: "Jeu en Pause",
            resume: "Continuer ➔", restart: "Recommencer 🔄", exit: "Menu Principal 🏠", nextCust: "Client Suivant ➔",
            celebTitle: "COIFFURE TERMINÉE!", earnings: "Gains:",
            tools: { comb: "Peigne à Séparer", needle: "Aiguille à Tresser", oil: "Huile Brillance", beads: "Perles & Coquillages" }
        }
    };

    let lang = "en";
    let score = 0;
    let customerIndex = 0;
    let completedLinesCount = 0;
    let isDrawing = false;
    let isPaused = false;
    let tracePoints = [];
    let currentHairstyle = null;
    let startTime = 0;
    let totalAccuracyErrors = 0;
    let totalSamples = 0;
    let currentTool = 'needle';

    const toolKeys = ['needle', 'comb', 'oil', 'beads'];
    const styleNames = ['Fulani Royal', 'Bantu Diamond', 'Douala Wave', 'Yaoundé Grid', 'Kribi Crown', 'Goddess Sweep', 'Tribal Lattice', 'Lemonade Twist'];

    function changeLanguage(newLang) {
        lang = newLang;
        const t = i18n[lang];
        document.getElementById('txt-queue').innerText = t.queue;
        document.getElementById('txt-req-label').innerText = t.req;
        document.getElementById('lbl-comb').innerText = t.comb;
        document.getElementById('lbl-needle').innerText = t.needle;
        document.getElementById('lbl-oil').innerText = t.oil;
        document.getElementById('lbl-beads').innerText = t.beads;
        document.getElementById('lbl-lang').innerText = t.lang;
        document.getElementById('lbl-diff').innerText = t.diff;
        document.getElementById('btn-start').innerText = t.start;
        document.getElementById('txt-paused').innerText = t.paused;
        document.getElementById('btn-resume').innerText = t.resume;
        document.getElementById('btn-restart').innerText = t.restart;
        document.getElementById('btn-exit').innerText = t.exit;
        document.getElementById('btn-next-cust').innerText = t.nextCust;
        document.getElementById('txt-celeb-title').innerText = t.celebTitle;
        document.getElementById('lbl-earnings').innerText = t.earnings;
        updateToolBanner();
    }

    // Canvas & Responsive Viewport Handling
    const canvas = document.getElementById('hairCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');

    function resizeCanvas() {
        const rect = canvasWrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const size = Math.min(rect.width - 10, rect.height - 10, 420);
        
        canvas.width = size * dpr;
        canvas.height = (size * 1.15) * dpr; // 1:1.15 aspect ratio suited for rear head view
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size * 1.15}px`;
        
        ctx.scale(dpr, dpr);
        if (currentHairstyle) drawScene();
    }

    window.addEventListener('resize', resizeCanvas);

    // Procedural Braid Pattern Generator
    function generateProceduralPattern(seed) {
        const pseudoRand = (offset) => {
            let x = Math.sin(seed * 99.123 + offset * 37.712) * 43758.5453;
            return x - Math.floor(x);
        };

        const tool = toolKeys[Math.floor(pseudoRand(1) * toolKeys.length)];
        const name = `${styleNames[Math.floor(pseudoRand(2) * styleNames.length)]} #${seed + 1}`;
        const patternType = Math.floor(pseudoRand(3) * 6);
        const lineCount = 3 + Math.floor(pseudoRand(4) * 3); // 3 to 5 lines for optimal touch area
        const lines = [];

        // Virtual coordinates space normalized to 300 x 345
        if (patternType === 0) {
            // S-Curves / Waves
            const amp = 25 + pseudoRand(5) * 20;
            for (let i = 0; i < lineCount; i++) {
                const startX = 70 + i * (160 / (lineCount - 1));
                lines.push({
                    pts: [
                        {x: startX, y: 70},
                        {x: startX + (i % 2 === 0 ? amp : -amp), y: 160},
                        {x: startX, y: 250}
                    ],
                    done: false
                });
            }
        } else if (patternType === 1) {
            // Radial Sunburst Crown
            const centerX = 150;
            const centerY = 150;
            const radius = 90;
            for (let i = 0; i < lineCount + 1; i++) {
                const angle = (Math.PI * 0.8 / lineCount) * i + Math.PI * 1.1;
                lines.push({
                    pts: [
                        {x: centerX, y: centerY},
                        {x: centerX + Math.cos(angle) * radius, y: centerY + Math.sin(angle) * radius}
                    ],
                    done: false
                });
            }
        } else if (patternType === 2) {
            // Bantu Diamond Lattice
            for (let i = 0; i < Math.min(lineCount, 4); i++) {
                lines.push({
                    pts: [{x: 80, y: 80 + i * 40}, {x: 150, y: 120 + i * 40}, {x: 220, y: 80 + i * 40}],
                    done: false
                });
            }
        } else if (patternType === 3) {
            // Lemonade Side Sweeps
            for (let i = 0; i < lineCount; i++) {
                const y = 80 + i * 35;
                lines.push({
                    pts: [{x: 60, y: y}, {x: 170, y: y + 20}, {x: 240, y: y + 50}],
                    done: false
                });
            }
        } else if (patternType === 4) {
            // Fulani Center & Arcs
            lines.push({ pts: [{x: 150, y: 65}, {x: 150, y: 255}], done: false }); // Center braid
            for (let i = 1; i < lineCount; i++) {
                const offset = i * 28;
                lines.push({ pts: [{x: 150 - offset, y: 85}, {x: 150 - offset - 15, y: 235}], done: false });
                lines.push({ pts: [{x: 150 + offset, y: 85}, {x: 150 + offset + 15, y: 235}], done: false });
            }
        } else {
            // Criss-Cross Diagonal Grid
            for (let i = 0; i < 3; i++) {
                lines.push({ pts: [{x: 70 + i * 40, y: 75}, {x: 230 - i * 40, y: 245}], done: false });
            }
        }

        return { name, tool, lines };
    }

    function selectTool(tool) {
        initAudio();
        triggerHaptic('light');
        currentTool = tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        document.getElementById(`btn-${tool}`).classList.add('active-tool');
    }

    function updateToolBanner() {
        if (!currentHairstyle) return;
        const req = currentHairstyle.tool;
        const name = i18n[lang].tools[req];
        const icons = { comb: '📏', needle: '🪡', oil: '✨', beads: '🐚' };
        document.getElementById('required-tool-display').innerHTML = `<span>${icons[req]}</span> <span>${name}</span>`;
    }

    function startGame() {
        initAudio();
        triggerHaptic('medium');
        document.getElementById('mainMenu').style.display = 'none';
        score = 0;
        customerIndex = 0;
        loadCustomer();
    }

    function loadCustomer() {
        completedLinesCount = 0;
        totalAccuracyErrors = 0;
        totalSamples = 0;
        currentHairstyle = generateProceduralPattern(customerIndex);
        startTime = Date.now();
        updateToolBanner();
        renderQueue();
        resizeCanvas();
    }

    function renderQueue() {
        const q = document.getElementById('queue-list');
        q.innerHTML = '';
        for (let i = customerIndex; i < customerIndex + 5; i++) {
            const style = generateProceduralPattern(i);
            const card = document.createElement('div');
            const isActive = (i === customerIndex);
            card.className = `w-full p-2 rounded-xl border flex flex-col items-center gap-1 transition-all ${
                isActive 
                ? 'bg-amber-900/80 border-amber-400 text-amber-100 shadow-md scale-105' 
                : 'bg-amber-950/40 border-amber-800/40 text-amber-400/60'
            }`;
            card.innerHTML = `
                <span class="text-base">${isActive ? '👩🏾' : '👤'}</span>
                <span class="text-[9px] font-bold tracking-tight text-center truncate w-full">${style.name.split(' ')[0]}</span>
            `;
            q.appendChild(card);
        }
    }

    // DRAWING & SCENE RENDERING
    function drawScene() {
        const targetW = 300;
        const targetH = 345;
        const scale = (canvas.width / (window.devicePixelRatio || 1)) / targetW;

        ctx.clearRect(0, 0, targetW * scale, targetH * scale);
        ctx.save();
        ctx.scale(scale, scale);

        // Shoulders & Nape (Perspective from Behind - NO Nose or Face)
        ctx.fillStyle = '#6b3a19'; // Rich dark skin tone
        ctx.beginPath();
        ctx.ellipse(150, 335, 115, 45, 0, 0, Math.PI * 2);
        ctx.fill();

        // Neck
        ctx.fillStyle = '#7c441e';
        ctx.fillRect(125, 230, 50, 75);

        // Ears (Rear view)
        ctx.fillStyle = '#6b3a19';
        ctx.beginPath(); ctx.arc(58, 175, 13, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(242, 175, 13, 0, Math.PI * 2); ctx.fill();

        // Head Base
        ctx.fillStyle = '#7c441e';
        ctx.beginPath();
        ctx.ellipse(150, 160, 92, 108, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#42210b';
        ctx.stroke();

        // Natural Unbraided Afro Texture
        ctx.fillStyle = '#140b05';
        ctx.beginPath();
        ctx.ellipse(150, 155, 98, 104, 0, 0, Math.PI * 2);
        ctx.fill();

        // Curl details for natural hair volume
        ctx.fillStyle = '#26150a';
        for (let x = 60; x <= 240; x += 15) {
            for (let y = 60; y <= 240; y += 15) {
                if (Math.hypot(x - 150, y - 155) < 92) {
                    ctx.beginPath();
                    ctx.arc(x + (x % 4), y + (y % 3), 5.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Draw Pattern Lines
        if (currentHairstyle) {
            currentHairstyle.lines.forEach((line) => {
                if (line.done) {
                    drawBraidedCornrow(line.pts);
                } else {
                    // Guide Line
                    ctx.beginPath();
                    ctx.setLineDash([7, 5]);
                    ctx.moveTo(line.pts[0].x, line.pts[0].y);
                    for (let p = 1; p < line.pts.length; p++) {
                        ctx.lineTo(line.pts[p].x, line.pts[p].y);
                    }
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#f59e0b';
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Start/End Guide Dots
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath(); ctx.arc(line.pts[0].x, line.pts[0].y, 4.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(line.pts[line.pts.length - 1].x, line.pts[line.pts.length - 1].y, 4.5, 0, Math.PI * 2); ctx.fill();
                }
            });
        }

        // Active Player Gesture Trace
        if (tracePoints.length > 1) {
            ctx.beginPath();
            ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
            for (let i = 1; i < tracePoints.length; i++) {
                ctx.lineTo(tracePoints[i].x, tracePoints[i].y);
            }
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#4ade80';
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawBraidedCornrow(pts) {
        // Renders detailed braided texture over completed guide lines
        const totalDist = getPathLength(pts);
        const steps = Math.max(12, Math.floor(totalDist / 8));

        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const pt = getPointOnPath(pts, t);

            // Scalp parting line behind braid
            ctx.fillStyle = '#5c3214';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 6.5, 0, Math.PI * 2);
            ctx.fill();

            // Platted hair overlapping segments
            ctx.fillStyle = (i % 2 === 0) ? '#3b200c' : '#1f1005';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Highlight shine
            ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
            ctx.beginPath();
            ctx.arc(pt.x - 1.5, pt.y - 1.5, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Geometry Helpers for Paths & Curves
    function getPathLength(pts) {
        let len = 0;
        for (let i = 0; i < pts.length - 1; i++) {
            len += Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
        }
        return len;
    }

    function getPointOnPath(pts, t) {
        if (pts.length === 2) {
            return {
                x: pts[0].x + (pts[1].x - pts[0].x) * t,
                y: pts[0].y + (pts[1].y - pts[0].y) * t
            };
        }
        // Quadratic Interpolation
        const oneMinusT = 1 - t;
        return {
            x: oneMinusT * oneMinusT * pts[0].x + 2 * oneMinusT * t * pts[1].x + t * t * pts[2].x,
            y: oneMinusT * oneMinusT * pts[0].y + 2 * oneMinusT * t * pts[1].y + t * t * pts[2].y
        };
    }

    function getScaledCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const normX = (clientX - rect.left) / rect.width;
        const normY = (clientY - rect.top) / rect.height;

        return { x: normX * 300, y: normY * 345 };
    }

    // Touch Event Handlers
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerStart(getScaledCanvasPos(e)); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(getScaledCanvasPos(e)); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handlePointerEnd(); }, {passive: false});

    canvas.addEventListener('mousedown', (e) => handlePointerStart(getScaledCanvasPos(e)));
    canvas.addEventListener('mousemove', (e) => handlePointerMove(getScaledCanvasPos(e)));
    canvas.addEventListener('mouseup', handlePointerEnd);

    function handlePointerStart(pos) {
        if (!currentHairstyle || isPaused) return;
        initAudio();

        if (currentTool !== currentHairstyle.tool) {
            triggerHaptic('heavy');
            return;
        }

        isDrawing = true;
        tracePoints = [pos];
    }

    function handlePointerMove(pos) {
        if (!isDrawing || !currentHairstyle) return;

        tracePoints.push(pos);
        playStrokeSound();
        drawScene();

        // Check distance to remaining line segments
        for (let i = 0; i < currentHairstyle.lines.length; i++) {
            const line = currentHairstyle.lines[i];
            if (!line.done && tracePoints.length > 0) {
                const startPt = line.pts[0];
                const endPt = line.pts[line.pts.length - 1];

                const dStart = Math.hypot(tracePoints[0].x - startPt.x, tracePoints[0].y - startPt.y);
                const dEnd = Math.hypot(pos.x - endPt.x, pos.y - endPt.y);

                const dStartRev = Math.hypot(tracePoints[0].x - endPt.x, tracePoints[0].y - endPt.y);
                const dEndRev = Math.hypot(pos.x - startPt.x, pos.y - startPt.y);

                // Check distance accuracy along stroke
                const midPt = getPointOnPath(line.pts, 0.5);
                const strokeMid = tracePoints[Math.floor(tracePoints.length / 2)] || pos;
                const strokeErr = Math.hypot(strokeMid.x - midPt.x, strokeMid.y - midPt.y);
                
                totalAccuracyErrors += strokeErr;
                totalSamples++;

                // Line completed if traced from start to end within tolerance
                if ((dStart < 30 && dEnd < 30) || (dStartRev < 30 && dEndRev < 30)) {
                    line.done = true;
                    completedLinesCount++;
                    triggerHaptic('medium');
                    
                    score += 350;
                    document.getElementById('hud-score').innerText = `${score.toLocaleString()} FCFA`;
                    
                    tracePoints = [];
                    drawScene();

                    // Check full hairstyle completion
                    if (completedLinesCount >= currentHairstyle.lines.length) {
                        isDrawing = false;
                        evaluateHairstylePerformance();
                    }
                    break;
                }
            }
        }
    }

    function handlePointerEnd() {
        isDrawing = false;
        tracePoints = [];
        drawScene();
    }

    // Realistic Performance & Time Rating System
    function evaluateHairstylePerformance() {
        const elapsedTime = (Date.now() - startTime) / 1000;
        const avgError = totalSamples > 0 ? (totalAccuracyErrors / totalSamples) : 20;

        let stars = "⭐⭐⭐";
        let ratingText = "Magnifique! High Precision";
        let bonus = 1500;

        // Dynamic thresholds based on difficulty
        if (elapsedTime > 22 || avgError > 32) {
            stars = "⭐";
            ratingText = "Needs practice...";
            bonus = 500;
            score += 200;
        } else if (elapsedTime > 12 || avgError > 18) {
            stars = "⭐⭐";
            ratingText = "Good Work!";
            bonus = 1000;
            score += 500;
        } else {
            score += 1000;
        }

        document.getElementById('celeb-stars').innerText = stars;
        document.getElementById('celeb-text').innerText = `Time: ${Math.round(elapsedTime)}s • Precision: ${Math.max(40, Math.round(100 - avgError))}%`;
        document.getElementById('celeb-money').innerText = `+${bonus.toLocaleString()} FCFA`;
        document.getElementById('hud-score').innerText = `${score.toLocaleString()} FCFA`;
        
        document.getElementById('celebrationOverlay').style.display = 'flex';
        triggerHaptic('heavy');
        playFanfareSound();
    }

    function nextCustomer() {
        triggerHaptic('light');
        document.getElementById('celebrationOverlay').style.display = 'none';
        customerIndex++;
        loadCustomer();
    }

    function togglePause() {
        triggerHaptic('light');
        isPaused = !isPaused;
        document.getElementById('pauseOverlay').style.display = isPaused ? 'flex' : 'none';
    }

    function restartGame() {
        document.getElementById('pauseOverlay').style.display = 'none';
        startGame();
    }

    function exitToMenu() {
        document.getElementById('pauseOverlay').style.display = 'none';
        document.getElementById('celebrationOverlay').style.display = 'none';
        document.getElementById('mainMenu').style.display = 'flex';
    }

    // Initialize UI language on boot
    changeLanguage('en');
</script>
</body>
